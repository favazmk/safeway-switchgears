# Hostinger's Git deploy copies the repo as-is and never builds it, so build
# the static export here and publish only out/ to the `hostinger` branch.
# Hostinger is pointed at that branch.
name: Build for Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the Windows-made lockfile lacks Linux-only optional deps.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./out
          commit_message: "Deploy ${{ github.sha }}"
